name: Build Android APK & Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install dependencies
        run: npm install

      - name: Build web assets
        run: npm run build

      - name: Generate Android project via Capacitor
        run: |
          rm -rf android
          npx cap add android
          npx cap sync android

      - name: Configure Android icons and manifest
        run: |
          for dir in mipmap-mdpi mipmap-hdpi mipmap-xhdpi mipmap-xxhdpi mipmap-xxxhdpi; do
            mkdir -p "android/app/src/main/res/$dir"
            cp public/pwa-512x512.png "android/app/src/main/res/$dir/ic_launcher.png"
            cp public/pwa-512x512.png "android/app/src/main/res/$dir/ic_launcher_round.png"
          done
          rm -rf android/app/src/main/res/mipmap-anydpi-v26

      - name: Build Android APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Prepare release APK asset
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk TRACE-android-v1.0.${{ github.run_number }}.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: TRACE Android APK v1.0.${{ github.run_number }}
          body: |
            Automated Android APK build for **TRACE**.
            Download and install the `.apk` file on your Android device.
          files: TRACE-android-v1.0.${{ github.run_number }}.apk
